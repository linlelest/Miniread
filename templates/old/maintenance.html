<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>维护中 · 极读</title>
<link rel="icon" href="/static/icon.png">
<script>try{var t=localStorage.getItem('mr-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
<script src="/static/js/detect.js"></script>
</head>
<body>
{% include '_loader.html' %}
{% include '_icons.html' %}
<div class="empty" style="min-height:100vh">
  <svg><use href="#icon-settings"/></svg>
  <div class="empty-title">网站维护中</div>
  <div class="empty-desc" id="msg">正在维护，请稍后再来。</div>
  <button class="btn mt-4" onclick="location.reload()">刷新重试</button>
</div>
<script src="/static/js/app.modern.js"></script>
<script>
fetch('/api/public/maintenance').then(r => r.json()).then(d => {
  if (d.data && d.data.reason) document.getElementById('msg').textContent = d.data.reason;
}).catch(() => {});
</script>
</body>
</html>
