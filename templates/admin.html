<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理后台 · 极读</title>
<link rel="icon" href="/static/icon.png?v={{ STATIC_V }}">
<script>try{var t=localStorage.getItem('mr-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<link rel="stylesheet" href="/static/css/tokens.css?v={{ STATIC_V }}">
<link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_V }}">
<script src="/static/js/detect.js?v={{ STATIC_V }}"></script>
<script src="/static/js/theme.js?v={{ STATIC_V }}" defer></script>
</head>
<body>
{% include '_loader.html' %}
{% include '_icons.html' %}
<header class="navbar">
  <a class="brand" href="/main"><svg><use href="#icon-logo"/></svg>极读</a>
  <nav class="nav-links">
    <a href="/main">书架</a>
    <a href="/admin" class="active">后台</a>
  </nav>
  <a href="/main" class="btn btn-ghost btn-sm" style="display:inline-flex;align-items:center;gap:5px;margin-left:auto"><svg style="width:14px;height:14px"><use href="#icon-arrow-left"/></svg>返回书架</a>
  <button id="btnTheme" class="btn btn-ghost btn-icon"><svg><use href="#icon-moon"/></svg></button>
</header>
<main class="container page-main">
  <div class="tabs">
    <button class="tab active" data-tab="users">用户</button>
    <button class="tab" data-tab="ann">公告</button>
    <button class="tab" data-tab="invite">邀请码</button>
    <button class="tab" data-tab="system">系统</button>
  </div>

  <section id="tab-users" class="mt-4">
    <div class="row" style="justify-content:flex-end"><button class="btn" id="btnReloadUsers"><svg><use href="#icon-refresh"/></svg>刷新</button></div>
    <div class="card mt-3" style="overflow:auto"><table class="table" id="usersTable"><thead>
      <tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr>
    </thead><tbody></tbody></table></div>
  </section>

  <section id="tab-ann" class="mt-4" hidden>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-primary" id="btnAddAnn"><svg><use href="#icon-plus"/></svg>新建公告</button>
    </div>
    <div id="annList" class="mt-3"></div>
  </section>

  <section id="tab-invite" class="mt-4" hidden>
    <div class="row gap-2" style="justify-content:flex-end">
      <input class="input" style="width:90px" id="invCount" type="number" min="1" max="100" value="10">
      <button class="btn btn-primary" id="btnGenInv"><svg><use href="#icon-plus"/></svg>批量生成</button>
    </div>
    <label class="setting-row"><label>开启邀请码注册</label>
      <span class="switch"><input type="checkbox" id="invEnabled"><span class="track"></span></span></label>
    <div class="card mt-3" style="overflow:auto"><table class="table" id="invTable"><thead>
      <tr><th>邀请码</th><th>已用 / 上限</th><th>备注</th><th>操作</th></tr>
    </thead><tbody></tbody></table></div>
  </section>

  <section id="tab-system" class="mt-4" hidden>
    <div class="card">
      <h3>维护模式</h3>
      <label class="setting-row"><label>开启维护</label>
        <span class="switch"><input type="checkbox" id="maintOn"><span class="track"></span></span></label>
      <div class="field"><label>维护说明</label><textarea class="textarea" id="maintMsg"></textarea></div>
      <button class="btn btn-primary" id="btnSaveMaint">保存</button>
    </div>
    <div class="card mt-3">
      <h3>版本更新</h3>
      <div class="row gap-2">
        <span id="sysVersion" class="text-2">当前版本：加载中</span>
        <button class="btn" id="btnCheckUpdate"><svg><use href="#icon-refresh"/></svg>检查更新</button>
      </div>
      <div id="updateResult" class="mt-2 text-2" style="font-size:var(--fs-sm)"></div>
    </div>
    <div class="card mt-3">
      <h3>数据备份</h3>
      <div class="row gap-2">
        <button class="btn" id="btnExport"><svg><use href="#icon-download"/></svg>导出数据</button>
        <input type="file" id="importFile" class="input" style="display:none">
        <button class="btn btn-danger" id="btnImport"><svg><use href="#icon-upload"/></svg>导入数据</button>
      </div>
      <div class="text-3 mt-2" style="font-size:var(--fs-xs)">导入将覆盖当前全部数据，请谨慎操作。</div>
    </div>
  </section>
</main>
<script src="/static/js/loader.js?v={{ STATIC_V }}"></script>
<script src="/static/js/app.modern.js?v={{ STATIC_V }}"></script>
<script src="/static/js/admin.modern.js?v={{ STATIC_V }}"></script>
</body>
</html>
