<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoNovel 指南 · 极读</title>
<link rel="icon" href="/static/icon.png?v={{ STATIC_V }}">
<script>try{var t=localStorage.getItem('mr-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<link rel="stylesheet" href="/static/css/tokens.css?v={{ STATIC_V }}">
<link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_V }}">
<script src="/static/js/detect.js?v={{ STATIC_V }}"></script>
</head>
<body>
{% include '_loader.html' %}
{% include '_icons.html' %}
<main class="container page-main" style="max-width:820px">
  <a class="btn btn-ghost" href="/main"><svg><use href="#icon-arrow-left"/></svg>返回</a>
  <h1 class="mt-3">SoNovel 对接指南</h1>
  <article id="guide" class="card mt-4" style="line-height:1.8">加载中…</article>
</main>
<script src="/static/js/app.modern.js?v={{ STATIC_V }}"></script>
<script>
function md(t) {
  const codes = [];
  t = t.replace(/```([\s\S]*?)```/g, (_, code) => {
    codes.push('<pre class="card" style="overflow:auto;padding:var(--s-3)"><code>' + code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>');
    return '\u0000CODE' + (codes.length - 1) + '\u0000';
  });
  t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  t = t
    .replace(/^###### (.*)$/gm, '<h6>$1</h6>').replace(/^##### (.*)$/gm, '<h5>$1</h5>')
    .replace(/^#### (.*)$/gm, '<h4>$1</h4>').replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/^---+\s*$/gm, '<hr>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy" style="max-width:100%;border-radius:var(--r-md);margin:var(--s-2) 0">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--primary)">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code class="kbd">$1</code>')
    .replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>')
    .replace(/^\s*\d+\. (.*)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul style="padding-left:1.4em;line-height:1.9">$1</ul>')
    .replace(/\n{2,}/g, '<br><br>');
  t = t.replace(/\u0000CODE(\d+)\u0000/g, (_, i) => codes[+i]);
  return t;
}
fetch('/aboutsonovelweb.md').then(r => r.text()).then(t => {
  document.getElementById('guide').innerHTML = md(t);
}).catch(() => {
  document.getElementById('guide').textContent = '指南加载失败';
});
</script>
</body>
</html>
